[project]
name = "reels-sav-bot"
version = "0.1.0"
description = "Private Telegram video downloader and X post reader"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=22.5,<23",
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2",
  "yt-dlp[curl-cffi]>=2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reels_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
